<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>POS Test Suite Runner</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #0f172a; color: #f8fafc; }
    h1 { color: #34d399; }
    .test-pass { color: #34d399; }
    .test-fail { color: #f87171; font-weight: bold; }
    .summary { margin-top: 1.5rem; font-size: 1.2rem; border-top: 1px solid #334155; padding-top: 1rem; }
  </style>
</head>
<body>
  <h1>🧪 Automated Test Runner - Kasir POS</h1>
  <div id="results">Menjalankan pengujian otomatis...</div>

  <script type="module">
    import { runCoreTests } from './tests/test-core.js';
    import { runCatalogTests } from './tests/test-catalog.js';
    import { runCartMathTests } from './tests/test-cart-math.js';
    import { runPaymentTests } from './tests/test-payment.js';
    import { runHistoryTests } from './tests/test-history.js';

    const allResults = [
      ...runCoreTests(),
      ...runCatalogTests(),
      ...runCartMathTests(),
      ...runPaymentTests(),
      ...runHistoryTests()
    ];

    const resultsDiv = document.getElementById('results');
    const passedCount = allResults.filter(r => r.passed).length;
    const totalCount = allResults.length;

    resultsDiv.innerHTML = `
      <div>
        ${allResults.map(r => `
          <div class="${r.passed ? 'test-pass' : 'test-fail'}">
            [${r.passed ? 'PASS' : 'FAIL'}] ${r.name}
          </div>
        `).join('')}
      </div>
      <div class="summary">
        Hasil: <b>${passedCount} / ${totalCount}</b> pengujian berhasil lulus 100%! 🎉
      </div>
    `;
  </script>
</body>
</html>
