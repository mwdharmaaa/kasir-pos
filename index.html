<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Pintar POS - Point of Sale Modern</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/payment.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header Navigation -->
    <header id="app-header" class="app-header"></header>

    <!-- Main POS Workspace -->
    <main class="main-content">
      <!-- Sisi Kiri: Katalog & Produk -->
      <section id="catalog-section" class="catalog-section"></section>

      <!-- Sisi Kanan: Keranjang & Tagihan -->
      <section id="cart-section" class="cart-section"></section>
    </main>
  </div>

  <!-- Container Notifikasi Toast -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Container Modal Popups -->
  <div id="modal-container"></div>

  <!-- Core Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
