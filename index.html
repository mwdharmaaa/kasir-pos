<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Pintar POS - Point of Sale Modern</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/payment.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header Navigation -->
    <header id="app-header" class="app-header">
      <div class="header-left">
        <div class="store-badge">
          <span class="store-icon">🛒</span>
          <div class="store-info">
            <h1 class="store-name" id="header-store-name">Warung Berkah POS</h1>
            <span class="store-tagline" id="header-store-tagline">Kasir Siap Melayani</span>
          </div>
        </div>
        <div class="date-time-widget">
          <span id="live-clock" class="live-clock">00:00:00</span>
          <span id="live-date" class="live-date">Memuat tanggal...</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Statistik Kilat Hari Ini -->
        <div class="header-stat-chip" title="Total Transaksi Hari Ini">
          <span class="stat-icon">🧾</span>
          <div class="stat-meta">
            <span class="stat-label">Transaksi</span>
            <span id="stat-today-count" class="stat-value">0</span>
          </div>
        </div>
        <div class="header-stat-chip" title="Total Omzet Hari Ini">
          <span class="stat-icon">💰</span>
          <div class="stat-meta">
            <span class="stat-label">Omzet</span>
            <span id="stat-today-revenue" class="stat-value">Rp 0</span>
          </div>
        </div>

        <!-- Tombol Aksi Header -->
        <button id="btn-open-history" class="header-btn" title="Riwayat Transaksi (F8)">
          <span class="btn-icon">📜</span> Riwayat
        </button>
        <button id="btn-open-inventory" class="header-btn" title="Kelola Produk & Stok">
          <span class="btn-icon">📦</span> Produk
        </button>
        <button id="btn-open-analytics" class="header-btn" title="Laporan & Ringkasan">
          <span class="btn-icon">📊</span> Laporan
        </button>
        <button id="btn-open-settings" class="header-btn" title="Pengaturan Toko">
          <span class="btn-icon">⚙️</span>
        </button>
        <button id="btn-toggle-theme" class="header-btn theme-toggle" title="Ganti Mode Gelap/Terang">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Main POS Workspace -->
    <main class="main-content">
      <!-- Sisi Kiri: Katalog & Produk -->
      <section id="catalog-section" class="catalog-section">
        <!-- Bilah Pencarian & Barcode -->
        <div class="catalog-toolbar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Cari nama produk atau scan barcode... (F2)" autocomplete="off">
            <button id="btn-clear-search" class="clear-search-btn" title="Hapus pencarian">&times;</button>
          </div>
          <button id="btn-refresh-catalog" class="catalog-action-btn" title="Muat Ulang Katalog">
            🔄
          </button>
        </div>

        <!-- Filter Tab Kategori -->
        <div class="categories-bar" id="categories-bar"></div>

        <!-- Grid Kartu Produk -->
        <div class="products-grid-container">
          <div class="products-grid" id="products-grid"></div>
        </div>
      </section>

      <!-- Sisi Kanan: Keranjang & Tagihan -->
      <section id="cart-section" class="cart-section"></section>
    </main>
  </div>

  <!-- Container Notifikasi Toast -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Container Modal Popups -->
  <div id="modal-container"></div>

  <!-- Core Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
